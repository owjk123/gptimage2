name: Build gptimage2 APK

on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: '创建 GitHub Release'
        type: boolean
        default: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gptimage2-Debug-v1.3.0
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: gptimage2-Release-v1.3.0
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create Release
        if: >
          (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.3.0' }}
          name: gptimage2 ${{ github.ref_type == 'tag' && github.ref_name || 'v1.3.0' }}
          body: |
            ## gptimage2 v1.3.0

            ### ✨ 新特性
            - 新增 **gpt-image-2-vip** 模型：支持 30 档固定尺寸含 4K，$0.03/张统一定价
            - VIP 30 档尺寸：3 档分辨率（1K Fast / 2K Recommended / 4K Detail）x 10 种比例
            - 524/504 自动重试：遇到超时自动重试（最多 3 次，15s 间隔）
            - VIP 参数适配：自动跳过 quality/n 等不支持参数
            - 改进的 b64_json 前缀兼容处理

            ### 🛠 修复
            - CI/CD 构建流程优化：使用 Gradle wrapper，移除手动下载
            - 自动创建 GitHub Release 并上传 APK 产物

            ### 📦 下载
            - `gptimage2-Release-v1.3.0.apk` — 正式版 APK
            - `gptimage2-Debug-v1.3.0.apk` — 调试版 APK
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
